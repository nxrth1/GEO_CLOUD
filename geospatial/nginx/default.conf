upstream geocloud_api {
    least_conn;

    server api1:8000;
    server api2:8000;
}

server {
    listen 80;
    server_name geo-cloud.duckdns.org;
    client_max_body_size 26m;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name geo-cloud.duckdns.org;
    client_max_body_size 26m;

    ssl_certificate /etc/letsencrypt/live/geo-cloud.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo-cloud.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://geocloud_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
