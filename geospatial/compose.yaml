services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gis_jobs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["python", "-m", "geospatial.init_db"]

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    build: .
    command: ["uvicorn", "geospatial.main:app", "--host", "0.0.0.0", "--port", "8000"]

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets

    ports:
      - "8000:8000"

    volumes:
      - datasets:/app/data/datasets

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "geospatial.worker"]

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets

    volumes:
      - datasets:/app/data/datasets

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data:
  datasets: