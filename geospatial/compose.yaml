services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gis_jobs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: geospatial/Dockerfile
    command: ["python", "-m", "geospatial.init_db"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: ${GEO_CLOUD_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api1:
    build:
      context: ..
      dockerfile: geospatial/Dockerfile
    command: ["uvicorn", "geospatial.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: ${GEO_CLOUD_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets
    expose:
      - "8000"
    volumes:
      - datasets:/app/data/datasets
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api2:
    build:
      context: ..
      dockerfile: geospatial/Dockerfile
    command: ["uvicorn", "geospatial.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: ${GEO_CLOUD_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets
    expose:
      - "8000"
    volumes:
      - datasets:/app/data/datasets
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: geospatial/Dockerfile
    command: ["python", "-m", "geospatial.worker"]
    stop_grace_period: 2m
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: ${GEO_CLOUD_ENV:-development}
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets
    volumes:
      - datasets:/app/data/datasets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${GEO_CLOUD_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  datasets:
