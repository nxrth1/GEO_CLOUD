services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gis_jobs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["python", "-m", "geospatial.init_db"]

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  services:

  api1:
    build: .
    command: ["uvicorn", "geospatial.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - datasets:/app/data/datasets
    restart: unless-stopped

  api2:
    build: .
    command: ["uvicorn", "geospatial.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - datasets:/app/data/datasets
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets

    expose:
      - "8000"

    volumes:
      - datasets:/app/data/datasets

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "geospatial.worker"]

    stop_grace_period: 2m

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gis_jobs}"
      GEO_CLOUD_ENV: development
      GEO_CLOUD_DATASETS_DIR: /app/data/datasets

    volumes:
      - datasets:/app/data/datasets

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
  datasets:
